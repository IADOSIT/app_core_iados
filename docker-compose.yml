version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: core_iados_backend
    ports:
      - "4000:4000"
#    env_file:
#      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
    volumes:
      - backend_backups:/app/backups
    restart: unless-stopped
    networks:
      - internal
      - internet_out    # bridge propio → NAT del host → fetch a internet funciona
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: core_iados_frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  backend_backups:
    name: core_iados_backups

networks:
  internal:
    name: core_iados_internal
  internet_out:
    name: core_iados_internet
    driver: bridge   # el host hace masquerade → salida a internet para fetch()
