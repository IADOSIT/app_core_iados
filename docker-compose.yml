version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: core_iados_backend
    ports:
      - "4000:4000"
    environment:
      # Server
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: https://core.iados.online

      # Database
      DB_HOST: 74.208.149.7
      DB_PORT: 5432
      DB_NAME: core_iados
      DB_USER: administrador
      DB_PASSWORD: U191tl1ebFN2RJR0fld5QhC8U29AhdOQ
      DB_SSL: "true"

      # JWT
      JWT_SECRET: CHANGE_THIS_TO_A_STRONG_RANDOM_SECRET
      JWT_REFRESH_SECRET: CHANGE_THIS_TO_ANOTHER_STRONG_SECRET
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

      # Email (SMTP)
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your_email@gmail.com
      SMTP_PASS: your_app_password
      EMAIL_FROM: Core iados <noreply@iados.mx>

      # App
      APP_NAME: Core iados CRM
      ADMIN_EMAIL: admin@iados.mx
    volumes:
      - backend_backups:/app/backups
    restart: unless-stopped
    networks:
      - web_network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: core_iados_frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web_network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  backend_backups:
    name: core_iados_backups

networks:
  web_network:
    external: true
